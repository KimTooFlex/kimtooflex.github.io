<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KimTools – Connect with Patreon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['DM Sans','sans-serif'], mono: ['DM Mono','monospace'] } } }
    }
    ;(function(){
      try {
        var t = localStorage.getItem('theme')||localStorage.getItem('kimtools-theme')||localStorage.getItem('color-theme');
        if(t==='light') document.documentElement.classList.remove('dark');
        else document.documentElement.classList.add('dark');
      } catch(e){ document.documentElement.classList.add('dark'); }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    :root{
      --bg:#f4f4f6; --card-bg:#fff; --card-bd:rgba(0,0,0,.07);
      --t1:#0f0f10; --t2:#6b6b72; --t3:#a0a0a8;
      --div:rgba(0,0,0,.055);
      --ok-bg:#f0faf4; --ok-bd:rgba(22,163,74,.18); --ok-tx:#15803d;
      --er-bg:#fff1f2; --er-bd:rgba(239,68,68,.18); --er-tx:#b91c1c;
      --row-bg:rgba(0,0,0,.025); --row-bd:rgba(0,0,0,.06);
      --warn-bg:rgba(234,179,8,.07); --warn-bd:rgba(234,179,8,.2); --warn-tx:#854d0e;
      --ring:rgba(0,0,0,.07);
    }
    .dark{
      --bg:#0c0c0e; --card-bg:#17171a; --card-bd:rgba(255,255,255,.055);
      --t1:#f2f2f4; --t2:#8f8f98; --t3:#56565e;
      --div:rgba(255,255,255,.05);
      --ok-bg:rgba(22,163,74,.08); --ok-bd:rgba(22,163,74,.2); --ok-tx:#4ade80;
      --er-bg:rgba(239,68,68,.07); --er-bd:rgba(239,68,68,.2); --er-tx:#f87171;
      --row-bg:rgba(255,255,255,.03); --row-bd:rgba(255,255,255,.06);
      --warn-bg:rgba(234,179,8,.06); --warn-bd:rgba(234,179,8,.15); --warn-tx:#fbbf24;
      --ring:rgba(255,255,255,.06);
    }

    body{
      font-family:'DM Sans',sans-serif;
      background:var(--bg); color:var(--t1);
      min-height:100dvh; display:flex; align-items:center; justify-content:center;
      transition:background .25s,color .25s;
    }
    body::before{
      content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
      background-image:linear-gradient(var(--div) 1px,transparent 1px),linear-gradient(90deg,var(--div) 1px,transparent 1px);
      background-size:40px 40px;
    }
    body::after{
      content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
      background:radial-gradient(ellipse 80% 60% at 50% 50%,transparent 30%,var(--bg) 100%);
    }

    #app{position:relative;z-index:1;width:100%;display:flex;justify-content:center;padding:2rem 1rem}

    .kt-card{
      background:var(--card-bg); border:1px solid var(--card-bd); border-radius:22px;
      width:100%; max-width:560px;
      display:flex; flex-direction:column; align-items:center;
      padding:2.25rem 2.25rem 1.75rem;
      animation:scaleIn .4s cubic-bezier(.16,1,.3,1) forwards;
    }
    .dark .kt-card{ box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 28px 80px rgba(0,0,0,.55); }
    .kt-card:not(.dark *){ box-shadow:0 2px 4px rgba(0,0,0,.04),0 12px 40px rgba(0,0,0,.06); }

    /* logos */
    .kt-logo{height:26px;width:auto}
    .kt-logo-dark{display:block}
    .kt-logo-light{display:none}
    :root:not(.dark) .kt-logo-dark{display:none}
    :root:not(.dark) .kt-logo-light{display:block}

    .kt-accent{width:24px;height:2.5px;border-radius:99px;background:#FF424D;margin-top:10px}
    .kt-divider{width:100%;height:1px;background:var(--div);margin:1.5rem 0}

    /* onboard */
    .kt-onboard{width:100%;animation:fadeUp .4s cubic-bezier(.16,1,.3,1) forwards}
    .kt-headline{font-size:17px;font-weight:600;color:var(--t1);text-align:center;margin-bottom:7px;line-height:1.35}
    .kt-sub{font-size:13.5px;color:var(--t2);text-align:center;line-height:1.6;margin-bottom:1.25rem}

    /* perks list */
    .kt-perks{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem}
    .kt-perk{
      display:flex;align-items:flex-start;gap:9px;
      background:var(--row-bg);border:1px solid var(--row-bd);
      border-radius:11px;padding:10px 11px;
    }
    .kt-perk-icon{
      flex-shrink:0;width:22px;height:22px;border-radius:6px;
      display:flex;align-items:center;justify-content:center;
      font-size:12px;background:rgba(255,66,77,.1);margin-top:1px;
    }
    .kt-perk-text{font-size:12.5px;color:var(--t2);line-height:1.5}
    .kt-perk-text strong{color:var(--t1);font-weight:500;display:block;margin-bottom:2px}

    /* warning / error notice card */
    .kt-notice{
      width:100%;border-radius:11px;padding:11px 13px;
      display:flex;align-items:flex-start;gap:10px;
      margin-bottom:1.1rem;border:1px solid;
    }
    .kt-notice.warn{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn-tx)}
    .kt-notice.err {background:var(--er-bg);  border-color:var(--er-bd);  color:var(--er-tx)}
    .kt-notice-icon{font-size:14px;flex-shrink:0;margin-top:1px}
    .kt-notice-text{font-size:12.5px;line-height:1.55}
    .kt-notice-text strong{font-weight:500;display:block;margin-bottom:2px}

    /* connect button */
    .kt-btn{
      width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
      padding:13px 20px;border-radius:12px;border:none;cursor:pointer;
      font-family:'DM Sans',sans-serif;font-size:14.5px;font-weight:600;
      color:#fff;background:#FF424D;letter-spacing:.01em;
      transition:background .18s,transform .15s,box-shadow .18s;
      margin-bottom:1rem;
    }
    .kt-btn:hover{background:#e53d48;box-shadow:0 4px 20px rgba(255,66,77,.3)}
    .kt-btn:active{transform:scale(.98)}
    .kt-btn svg{width:18px;height:18px;flex-shrink:0}

    /* single footer line */
    .kt-foot{font-size:11px;color:var(--t3);text-align:center;margin-top:.25rem}

    /* auth state */
    .kt-auth{width:100%;display:flex;flex-direction:column;align-items:center;animation:fadeUp .4s cubic-bezier(.16,1,.3,1) forwards}
    .kt-loader{width:52px;height:52px;object-fit:contain}
    .kt-icon{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
    .kt-icon.ok {background:var(--ok-bg);color:var(--ok-tx);border:1px solid var(--ok-bd)}
    .kt-icon.err{background:var(--er-bg);color:var(--er-tx);border:1px solid var(--er-bd)}
    .kt-status{font-size:13px;font-weight:500;color:var(--t2);transition:color .3s;margin-top:13px;text-align:center}
    .kt-status.ok {color:var(--ok-tx)}
    .kt-status.err{color:var(--er-tx)}
    .kt-dots{display:inline-flex;gap:3px;margin-left:4px;vertical-align:middle}
    .kt-dots span{
      width:3px;height:3px;border-radius:50%;
      background:currentColor;display:inline-block;
      animation:pulseDot 1.4s ease-in-out infinite;
    }
    .kt-dots span:nth-child(2){animation-delay:.2s}
    .kt-dots span:nth-child(3){animation-delay:.4s}
    .kt-msg{
      width:100%;border-radius:10px;padding:12px 14px;
      font-family:'DM Mono',monospace;font-size:12px;line-height:1.65;
      word-break:break-word;border:1px solid;
      animation:fadeUp .35s cubic-bezier(.16,1,.3,1) forwards;margin-top:1.25rem;
    }
    .kt-msg.ok {background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-tx)}
    .kt-msg.err{background:var(--er-bg);border-color:var(--er-bd);color:var(--er-tx)}

    /* theme btn */
    .kt-theme-btn{
      position:fixed;top:1.25rem;right:1.25rem;
      width:34px;height:34px;border-radius:9px;
      border:1px solid var(--card-bd);background:var(--card-bg);color:var(--t2);
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      font-size:14px;z-index:10;transition:background .2s,border-color .2s;
    }
    .kt-theme-btn:hover{color:var(--t1)}

    @keyframes scaleIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
    @keyframes fadeUp {from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.25}}
  </style>
</head>
<body>

  <button class="kt-theme-btn" id="themeToggle" aria-label="Toggle theme">
    <span id="themeIcon">☀</span>
  </button>

  <div id="app"></div>

  <script>
    const LATENCY   = 4000;
    const CLIENT_ID = "-lKDPRbFOgcbusmxjvr65oiiUtcY2m4-rCoWoEIVLUKuSgzOsQIQy4hi8yO9cDOa";
    const BASE_URL  = "https://www.patreon.com/oauth2/authorize";

    const THEME_KEY = 'theme';
    const htmlEl    = document.documentElement;
    const tBtn      = document.getElementById('themeToggle');
    const tIcon     = document.getElementById('themeIcon');
    function applyTheme(t){
      if(t==='light'){htmlEl.classList.remove('dark');tIcon.textContent='☽'}
      else{htmlEl.classList.add('dark');tIcon.textContent='☀'}
      try{localStorage.setItem(THEME_KEY,t)}catch(e){}
    }
    tBtn.addEventListener('click',()=>applyTheme(htmlEl.classList.contains('dark')?'light':'dark'));
    tIcon.textContent = htmlEl.classList.contains('dark') ? '☀' : '☽';

    const { createApp, ref, onMounted } = Vue;

    createApp({
      setup(){
        const phase   = ref('onboard');
        const status  = ref('Connecting');
        const done    = ref(false);
        const message = ref('');
        const isError = ref(false);

        const params     = new URLSearchParams(window.location.search);
        const state      = params.get('state');
        const errorParam = params.get('error'); // e.g. ?error=session_expired&error_description=...

        const patreonUrl = `${BASE_URL}?response_type=code&client_id=${CLIENT_ID}&scope=identity&state=${state}`;
        function connectPatreon(){ window.location.href = patreonUrl; }

        onMounted(async () => {
          console.clear();
          if(params.get('code')){
            phase.value = 'auth';
            await runIpc();
          }
        });

        async function runIpc(msg=null, success=null){
          try{
            done.value = false;
            let code = params.get('code');
            if(!code){
              code = localStorage.getItem('code');
              message.value = 'Authorization was denied or cancelled. Please try again.';
              isError.value = true;
              if(!code){ done.value=true; return; }
            } else {
              localStorage.setItem('code', code);
            }

            status.value = 'Verifying with Patreon';
            let url = `http://localhost:${state}?code=${encodeURIComponent(code)}`;
            if(success !== null) url += `&success=${success}`;
            if(msg !== null && msg.trim().length > 0) url += `&message=${encodeURIComponent(msg)}`;

            const start = Date.now();
            const res   = await fetch(url);
            const text  = await res.text();
            const rem   = 300-(Date.now()-start);
            if(rem>0) await new Promise(r=>setTimeout(r,rem));

            if(res.ok){
              isError.value = false;
              message.value = text;
              status.value  = 'Connected successfully';
              done.value    = true;
              setTimeout(()=>window.location.href='https://kimtoo.net', LATENCY);
              return;
            }
            isError.value = true;
            message.value = text || `Server returned ${res.status}`;
            status.value  = 'Something went wrong';
          } catch(err){
            isError.value = true;
            status.value  = 'Connection failed';
            message.value = err.message || 'Could not reach the local server.';
          } finally {
            if(done.value !== true) await runIpc(message.value, !isError.value);
          }
        }

        return { phase, status, done, message, isError, state, errorParam, connectPatreon };
      },

      template: `
        <div class="kt-card">

          <img src="https://kimtoo.net/images/logo-wide-dark.webp" alt="KimTools" class="kt-logo kt-logo-dark" />
          <img src="https://kimtoo.net/images/logo-wide.webp"      alt="KimTools" class="kt-logo kt-logo-light" />
          <div class="kt-accent"></div>
          <div class="kt-divider"></div>

          <!-- ONBOARD -->
          <div v-if="phase === 'onboard'" class="kt-onboard">

            <p class="kt-headline">Activate your KimTools session</p>
            <p class="kt-sub">Sign in with Patreon to verify your membership and unlock your licensed controls inside Visual Studio.</p>

            <div class="kt-perks">
              <div class="kt-perk">
                <div class="kt-perk-icon">🔑</div>
                <p class="kt-perk-text"><strong>Verify your tier</strong>KimTools checks your active Patreon membership to unlock the right controls for your plan.</p>
              </div>
              <div class="kt-perk">
                <div class="kt-perk-icon">🔒</div>
                <p class="kt-perk-text"><strong>No passwords stored</strong>We never see your Patreon password. OAuth2 is the same standard used by Google and GitHub.</p>
              </div>
              <div class="kt-perk">
                <div class="kt-perk-icon">⚡</div>
                <p class="kt-perk-text"><strong>One-time setup</strong>After this, KimTools reconnects silently. You won't need to do this again unless you log out.</p>
              </div>
              <div class="kt-perk">
                <div class="kt-perk-icon">👁</div>
                <p class="kt-perk-text"><strong>Read-only access</strong>KimTools only reads your membership tier. It cannot post, charge, or change anything on your account.</p>
              </div>
            </div>

            <!-- error notice (from ?error= param) replaces the warning notice -->
            <div v-if="errorParam" class="kt-notice err">
              <span class="kt-notice-icon">⚠</span>
              <p class="kt-notice-text">
                <strong>{{ errorParam.replace(/_/g,' ') }}</strong>
                {{ new URLSearchParams(window.location.search).get('error_description') || 'Something went wrong with your session. Please reconnect.' }}
              </p>
            </div>

            <!-- default localhost warning -->
            <div v-else class="kt-notice warn">
              <span class="kt-notice-icon">ℹ</span>
              <p class="kt-notice-text">
                <strong>Patreon may show a security notice</strong>
                This is expected. It appears because KimTools connects to your local machine (localhost). The connection is private and never leaves your computer.
              </p>
            </div>

            <button class="kt-btn" v-if="state" @click="connectPatreon">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M14.82 2.41C18.78 2.41 22 5.65 22 9.62C22 13.58 18.78 16.8 14.82 16.8C10.85 16.8 7.61 13.58 7.61 9.62C7.61 5.65 10.85 2.41 14.82 2.41Z" fill="white"/>
                <path d="M2 21.6H5.5V2.41H2V21.6Z" fill="white"/>
              </svg>
              Continue with Patreon
            </button>

            <p v-if="!state" style="font-size:12px;color:var(--er-tx);text-align:center;margin-bottom:12px;">
              Open this page from within KimTools to get started.
            </p>

            <p class="kt-foot">🔐 OAuth2 · Read-only · kimtoo.net</p>

          </div>

          <!-- AUTH -->
          <div v-if="phase === 'auth'" class="kt-auth">

            <img v-if="!done" src="./images/loader.gif" class="kt-loader" alt="Loading" />
            <div v-else>
              <div v-if="isError" class="kt-icon err">✕</div>
              <div v-else         class="kt-icon ok">✓</div>
            </div>

            <p class="kt-status" :class="done && isError ? 'err' : done ? 'ok' : ''">
              {{ status }}<span v-if="!done" class="kt-dots"><span></span><span></span><span></span></span>
            </p>

            <div
              v-if="done && message"
              class="kt-msg"
              :class="isError ? 'err' : 'ok'"
              v-html="message"
            ></div>

            <p class="kt-foot" style="margin-top:1.5rem">kimtoo.net · Patreon OAuth2</p>

          </div>

        </div>
      `
    }).mount('#app');
  </script>
</body>
</html>
